name: TagShelf Conductor image

on:
  pull_request:
    branches: [release/3.32.4]
  push:
    branches: [release/3.32.4, fix/scheduler-observability]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tagshelf-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: tagshelf-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: tagshelf-gradle-${{ runner.os }}-
      - name: Check formatting, test scheduler in memory, and build server
        run: |
          ./gradlew :conductor-core:spotlessCheck :conductor-core:test \
            --tests com.netflix.conductor.core.execution.AsyncSystemTaskExecutorTest \
            --tests com.netflix.conductor.core.execution.tasks.TestSystemTaskWorker \
            :conductor-server:bootJar \
            -Pversion=3.32.4 --no-daemon --no-scan --max-workers=2 \
            -Dorg.gradle.jvmargs=-Xmx2g
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build ui-next from locked dependencies
        working-directory: ui-next
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      - name: Stage server artifact
        run: |
          mkdir -p docker/server/libs
          cp server/build/libs/*boot*.jar docker/server/libs/conductor-server.jar
      - uses: actions/upload-artifact@v7
        with:
          name: conductor-server
          path: docker/server/libs/conductor-server.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: conductor-ui
          path: ui-next/dist
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scheduler-test-results
          path: core/build/test-results/test
          if-no-files-found: ignore

  image:
    needs: validate
    if: github.repository == 'tagshelfsrl/conductor-oss' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: conductor-server
          path: docker/server/libs
      - uses: actions/download-artifact@v8
        with:
          name: conductor-ui
          path: ui-next/dist
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: docker/server/Dockerfile.next
          platforms: linux/amd64
          push: true
          build-args: PREBUILT=true
          tags: ghcr.io/tagshelfsrl/conductor-oss:3.32.4-tagshelf-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/tagshelfsrl/conductor-oss
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=3.32.4
      - name: Record immutable image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/tagshelfsrl/conductor-oss@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
